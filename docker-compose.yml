version: "3.8"

services:
  gpt-sovits:
    image: breakstring/gpt-sovits:latest
    ports:
      - "9880:9880"
    volumes:
      - ./gpt_sovits_models/GPT_weights_v2:/workspace/GPT_weights_v2
      - ./gpt_sovits_models/SoVITS_weights_v2:/workspace/SoVITS_weights_v2
      - ./gpt_sovits_models/reference:/workspace/reference
    environment:
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      sh -c "python api_v2.py -a 0.0.0.0 -p 9880"
